name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Repository preflight
        shell: pwsh
        run: python scripts/repo_preflight.py
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build
      - name: Test
        shell: pwsh
        run: pytest -q
      - name: Build wheel
        shell: pwsh
        run: python -m build --wheel
      - name: Package Windows release
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v1.2.2" }
          python scripts/package_release.py --version $tag
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/EIRVEN-Windows-${{ github.ref_name }}.zip" `
            "release/SHA256SUMS.txt" `
            --title "EIRVEN ${{ github.ref_name }} — Public Release" `
            --generate-notes
