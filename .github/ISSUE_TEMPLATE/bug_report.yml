name: Bug report
description: Сообщить о воспроизводимой ошибке EIRVEN
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Не прикладывай приватные логи без удаления персональных данных, токенов и переписок."
  - type: input
    id: version
    attributes:
      label: Версия EIRVEN
      placeholder: "1.2.2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Что сказал/сделал пользователь и что было на экране?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
